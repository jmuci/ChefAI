# Meal plans: an anonymous user saves a recipe, then puts it on a day from the week view's
# "+ Add meal" sheet by searching their saved recipes inside the sheet.
#
# Needs a backend with at least one public recipe matching the query (saving it goes through
# Search; the debug build talks to http://10.0.2.2:8080). The sheet itself searches only saved
# recipes, on-device, so the check is structural: the week goes from no meals to one.
appId: com.tenmilelabs.chefai
tags:
  - mealplans
  - backend
env:
  QUERY: pasta
---
- launchApp:
    clearState: true

# Save one recipe, so the sheet has something to offer.
- tapOn: "Search"
- tapOn: "Search…"
- inputText: ${QUERY}
- hideKeyboard
- extendedWaitUntil:
    visible: ".*RESULTS?"
    timeout: 15000
- tapOn:
    text: "Save to collection"
    index: 0
- assertVisible: "Remove from collection"

- tapOn: "Meal Plans"
- assertVisible: "0 meals planned.*"
- tapOn:
    text: "+ Add meal"
    index: 0

# The sheet lists the saved recipe before anything is typed; picking it closes the sheet.
- assertVisible: "Search your saved recipes"
- assertVisible: "Add a New Recipe"
- tapOn:
    text: ".* · Serves .*"
    index: 0
- assertNotVisible: "Search your saved recipes"
- assertVisible: "1 meal planned.*"
