# Meal plans: an anonymous user saves a recipe, then picks it from the week view's "+ Add meal"
# sheet, which opens the meal-plan wizard seeded with that recipe and starting on that day.
#
# Needs a backend with at least one public recipe matching the query (saving it goes through
# Search). The sheet itself searches only saved recipes, on-device, so the check is structural:
# the week goes from no meals to at least one once the wizard has created the plan.
appId: com.tenmilelabs.chefai
tags:
  - mealplans
  - backend
env:
  QUERY: pasta
---
- launchApp:
    clearState: true

# Save one recipe, so the sheet has something to offer.
- tapOn: "Search"
- tapOn: "Search…"
- inputText: ${QUERY}
- hideKeyboard
- extendedWaitUntil:
    visible: ".*RESULTS?"
    timeout: 15000
- tapOn:
    text: "Save to collection"
    index: 0
- assertVisible: "Remove from collection"

- tapOn: "Meal Plans"
- assertVisible: "0 meals planned.*"
- tapOn:
    text: "+ Add meal"
    index: 0

# The sheet lists the saved recipe before anything is typed; picking it opens the wizard.
- assertVisible: "Search your saved recipes"
- tapOn:
    text: ".* · Serves .*"
    index: 0
- assertVisible: "Which day does the meal plan start?"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Create.*"
- extendedWaitUntil:
    notVisible: "Which day does the meal plan start?"
    timeout: 20000
- back
- assertNotVisible: "0 meals planned.*"
