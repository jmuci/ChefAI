# Auth: forgot password -> emailed link -> new password -> sign in with it.
#
# Needs the backend running LOCALLY IN DEVELOPMENT MODE (no EMAIL_API_KEY): reset emails then land
# in GET /dev/outbox instead of being sent. The debug build talks to http://10.0.2.2:8080 unless a
# Developer options REMOTE switch persisted — check that first, or the app and this script will
# disagree about which backend holds the token.
#
# Registers its own throwaway account (username suffixed with a timestamp). The reset link is
# opened with `openLink`; if the app isn't a verified handler for pocket-chef.app on the emulator,
# Android shows a chooser, which the optional step below dismisses toward the app.
appId: com.tenmilelabs.chefai
tags:
  - auth
  - backend
env:
  PASSWORD: maestro1234
  NEW_PASSWORD: maestro5678
---
- evalScript: ${output.username = 'maestro' + Date.now()}
- launchApp:
    clearState: true

# Register, then sign out.
- tapOn: "Open profile menu"
- tapOn: "Log in / Register"
- tapOn: "Create Account"
- tapOn: "Username"
- inputText: ${output.username}
- tapOn: "Email"
- inputText: ${output.username + '@example.com'}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Confirm Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Create Account"
    index: 1 # The screen title shares the button's text.
- extendedWaitUntil:
    visible: "Open profile menu"
    timeout: 15000
- tapOn: "Open profile menu"
- tapOn: "Logout"

# Ask for a reset link from the login screen, with the email carried over.
- tapOn: "Open profile menu"
- tapOn: "Log in / Register"
- tapOn: "Email"
- inputText: ${output.username + '@example.com'}
- hideKeyboard
- tapOn: "Forgot password?"
- assertVisible: "Reset your password"
- tapOn: "Send reset link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- assertVisible: "If an account exists for.*"
- assertVisible: "Resend in.*"

# Follow the emailed link.
- runScript: scripts/fetch_reset_link.js
- openLink: ${output.resetLink}
- runFlow:
    when:
      visible: "Open with"
    commands:
      - tapOn: "Pocket Chef"
      - tapOn: "Just once"
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 15000

# Mismatch is caught on the device, before any request.
- tapOn: "New password"
- inputText: ${NEW_PASSWORD}
- tapOn: "Confirm new password"
- inputText: ${NEW_PASSWORD + 'x'}
- hideKeyboard
- tapOn: "Update password"
- assertVisible: "Passwords don't match"

# Fix it and submit.
- tapOn: "Confirm new password"
- eraseText: 40
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn: "Update password"
- extendedWaitUntil:
    visible: "Password updated.*"
    timeout: 15000

# Sign in with the new password.
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${output.username + '@example.com'}
- tapOn: "Password"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn: "Log In"
- extendedWaitUntil:
    visible: "Open profile menu"
    timeout: 15000
- tapOn: "Open profile menu"
- assertVisible: ${output.username}

# The link is single-use: opening it again lands on the expired screen.
- tapOn: "Logout"
- openLink: ${output.resetLink}
- extendedWaitUntil:
    visible: "This link has expired"
    timeout: 15000
