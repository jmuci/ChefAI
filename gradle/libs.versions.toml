hiltAndroidCompiler = "2.56.2"
kotlin = "2.1.20"
kotlinxCoroutines = "1.10.2"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
hilt = "2.56.2"
kspVersion = "2.1.20-2.0.1"
lifecycleViewmodelCompose = "2.9.1"
material = "1.12.0"
