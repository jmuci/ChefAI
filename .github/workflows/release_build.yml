name: Android Release Build

# Catches what only the release variant checks: lintVitalRelease / lintRelease errors and R8
# failures (missing keep rules). Unsigned: no upload key in CI. The mapping file and the R8
# missing-rules report are uploaded so a failure can be read without a local build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-build:
    name: Release lint + minified build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Lint and build release
        # versionCode is pinned: a shallow checkout's commit count is meaningless.
        run: ./gradlew :app:lintRelease :app:bundleRelease -PchefaiVersionCode=${{ github.run_number }} --stacktrace
      - name: Upload lint report and R8 outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build-reports
          path: |
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
